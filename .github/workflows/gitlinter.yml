name: Git Lint CI
on:
  pull_request:

jobs:
  lint-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: nicu1989/cicd-workflows/.github/workflows/gitlint.yml@nicu1989_add_gitlint
        with:
          pr-number: ${{ github.event.pull_request.number }}
          base-branch: ${{ github.event.pull_request.base.ref }}
          gitlint-file: ".gitlint"
          workflow-version: nicu1989_add_gitlint
